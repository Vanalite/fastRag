name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fastrag
          POSTGRES_PASSWORD: fastrag
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fastrag" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FASTRAG_TEST_DATABASE_URL: postgresql+asyncpg://fastrag:fastrag@localhost:5432/fastrag_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Type-check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  dsh-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/dsh-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fastrag:ci .
