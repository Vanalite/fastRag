[project]
name = "fastrag"
version = "0.1.0"
description = "Retrieval service for SMB AI agents: hybrid document search, typed listings, evidence signals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "typer>=0.12",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "underthesea>=6.8",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Run BGE-M3 / bge-reranker in-process instead of calling an inference server.
local-models = ["sentence-transformers>=3.0"]
# Better PDF/Office parsing (layout, tables). Heavy: pulls torch.
docling = ["docling>=2.0"]
# S3-compatible object storage for raw files.
s3 = ["boto3>=1.34"]
# Google Drive / Sheets connector.
google = ["google-api-python-client>=2.130", "google-auth>=2.29"]
# MCP server for agent platforms.
mcp = ["mcp>=1.2,<3"]

[project.scripts]
fastrag = "fastrag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "respx>=0.21",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastrag"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S608", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF059", "UP031"]
"src/fastrag/db/migrations/**" = ["E501"]
"scripts/**" = ["S311", "B023", "RUF046"]

[tool.mypy]
python_version = "3.11"
packages = ["fastrag"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs a Postgres database (FASTRAG_TEST_DATABASE_URL)"]
