[project]
name = "fastrag"
version = "0.2.0"
description = "A reference implementation of an enterprise-grade RAG system: multi-tenant, access-controlled, auditable and evaluated."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
claude = ["anthropic>=0.70"]
st = ["sentence-transformers>=3.0"]

[project.scripts]
fastrag = "fastrag.cli:main"

[dependency-groups]
dev = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
