      hn-ba-dinh: ["Ba Đình", "Quận Ba Đình"]
      hn-hoan-kiem: ["Hoàn Kiếm", "Quận Hoàn Kiếm"]
      hn-tay-ho: ["Tây Hồ", "Quận Tây Hồ"]
